            - heading "YouTube Data API Overview" [level=1] [ref=e196]
            - generic [ref=e197]:
              - heading "Introduction" [level=2] [ref=e198]
              - paragraph [ref=e199]: This document is intended for developers who want to write applications that interact with YouTube. It explains basic concepts of YouTube and of the API itself. It also provides an overview of the different functions that the API supports.
              - heading "Before you start" [level=3] [ref=e200]
              - list [ref=e201]:
                - listitem [ref=e202]:
                  - paragraph [ref=e203]:
                    - text: You need a
                    - link "Google Account" [ref=e204] [cursor=pointer]:
                      - /url: https://www.google.com/accounts/NewAccount
                    - text: to access the Google Cloud console, request an API key, and register your application.
                - listitem [ref=e205]:
                  - paragraph [ref=e206]:
                    - text: Create a project in the
                    - link "Google Cloud console" [ref=e207] [cursor=pointer]:
                      - /url: https://console.cloud.google.com
                    - text: and
                    - link "obtain authorization credentials" [ref=e208] [cursor=pointer]:
                      - /url: /youtube/registering_an_application
                    - text: so your application can submit API requests.
                - listitem [ref=e209]:
                  - paragraph [ref=e210]: "After creating your project, make sure the YouTube Data API is one of the services that your application is registered to use:"
                  - list [ref=e211]:
                    - listitem [ref=e212]:
                      - text: Go to the
                      - link "Cloud console" [ref=e213] [cursor=pointer]:
                        - /url: https://console.cloud.google.com/
                      - text: and select the project that you just registered.
                    - listitem [ref=e214]:
                      - text: Visit the
                      - link "Enabled APIs page" [ref=e215] [cursor=pointer]:
                        - /url: https://console.cloud.google.com/apis/enabled
                      - text: . Make sure that the YouTube Data API is on the list of enabled APIs. If it isn't, then
                      - link "open the API Library" [ref=e216] [cursor=pointer]:
                        - /url: https://console.cloud.google.com/apis/library
                      - text: and enable the API.
                - listitem [ref=e217]:
                  - paragraph [ref=e218]:
                    - text: If your application will use any API methods that require user authorization, read the
                    - link "authentication" [ref=e219] [cursor=pointer]:
                      - /url: /youtube/data/guides/authentication
                    - text: guide to learn how to implement OAuth 2.0 authorization.
                - listitem [ref=e220]:
                  - paragraph [ref=e221]:
                    - text: Select a
                    - link "client library" [ref=e222] [cursor=pointer]:
                      - /url: /youtube/data/libraries
                    - text: to simplify your API implementation.
                - listitem [ref=e223]:
                  - paragraph [ref=e224]:
                    - text: Familiarize yourself with the core concepts of the JSON (JavaScript Object Notation) data format. JSON is a common, language-independent data format that provides a text representation of arbitrary data structures. For more information, see
                    - link "json.org" [ref=e225] [cursor=pointer]:
                      - /url: https://json.org
                    - text: .
              - heading "Resources and resource types" [level=2] [ref=e226]
              - paragraph [ref=e227]: A resource is an individual data entity with a unique identifier. The following table describes the different types of resources that you can interact with using the API.
              - table [ref=e228]:
                - rowgroup [ref=e229]:
                  - row [ref=e230]:
                    - columnheader "Resources" [ref=e231]
                  - row [ref=e232]:
                    - cell [ref=e233]:
                      - code [ref=e234]: activity
                    - cell "Contains information about an action that a particular user has taken on the YouTube site. User actions that are reported in activity feeds include rating a video, sharing a video, marking a video as a favorite, and posting a channel bulletin, among others." [ref=e235]
                  - row [ref=e236]:
                    - cell [ref=e237]:
                      - code [ref=e238]: channel
                    - cell "Contains information about a single YouTube channel." [ref=e239]
                  - row [ref=e240]:
                    - cell [ref=e241]:
                      - code [ref=e242]: channelBanner
                    - cell "Identifies the URL to use to set a newly uploaded image as the banner image for a channel." [ref=e243]
                  - row [ref=e244]:
                    - cell [ref=e245]:
                      - code [ref=e246]: channelSection
                    - cell "Contains information about a set of videos that a channel has chosen to feature. For example, a section could feature a channel's latest uploads, most popular uploads, or videos from one or more playlists." [ref=e247]
                  - row [ref=e248]:
                    - cell [ref=e249]:
                      - code [ref=e250]: guideCategory
                    - cell "Identifies a category that YouTube associates with channels based on their content or other indicators, such as popularity. Guide categories seek to organize channels in a way that makes it easier for YouTube users to find the content they're looking for. While channels could be associated with one or more guide categories, they are not guaranteed to be in any guide categories." [ref=e251]
                  - row [ref=e252]:
                    - cell [ref=e253]:
                      - code [ref=e254]: i18nLanguage
                    - cell "Identifies an application language that the YouTube website supports. The application language can also be referred to as a UI language." [ref=e255]
                  - row [ref=e256]:
                    - cell [ref=e257]:
                      - code [ref=e258]: i18nRegion
                    - cell "Identifies a geographic area that a YouTube user can select as the preferred content region. The content region can also be referred to as a content locale." [ref=e259]
                  - row [ref=e260]:
                    - cell [ref=e261]:
                      - code [ref=e262]: playlist
                    - cell "Represents a single YouTube playlist. A playlist is a collection of videos that can be viewed sequentially and shared with other users." [ref=e263]
                  - row [ref=e264]:
                    - cell [ref=e265]:
                      - code [ref=e266]: playlistItem
                    - cell "Identifies a resource, such as a video, that is part of a playlist. The playlistItem resource also contains details that explain how the included resource is used in the playlist." [ref=e267]
                  - row [ref=e268]:
                    - cell [ref=e269]:
                      - code [ref=e270]: search result
                    - cell "Contains information about a YouTube video, channel, or playlist that matches the search parameters specified in an API request. While a search result points to a uniquely identifiable resource, like a video, it does not have its own persistent data." [ref=e271]
                  - row [ref=e272]:
                    - cell [ref=e273]:
                      - code [ref=e274]: subscription
                    - cell "Contains information about a YouTube user subscription. A subscription notifies a user when new videos are added to a channel or when another user takes one of several actions on YouTube, such as uploading a video, rating a video, or commenting on a video." [ref=e275]
                  - row [ref=e276]:
                    - cell [ref=e277]:
                      - code [ref=e278]: thumbnail
                    - cell "Identifies thumbnail images associated with a resource." [ref=e279]
                  - row [ref=e280]:
                    - cell [ref=e281]:
                      - code [ref=e282]: video
                    - cell "Represents a single YouTube video." [ref=e283]
                  - row [ref=e284]:
                    - cell [ref=e285]:
                      - code [ref=e286]: videoCategory
                    - cell "Identifies a category that has been or could be associated with uploaded videos." [ref=e287]
                  - row [ref=e288]:
                    - cell [ref=e289]:
                      - code [ref=e290]: watermark
                    - cell "Identifies an image that displays during playbacks of a specified channel's videos. The channel owner can also specify a target channel to which the image links as well as timing details that determine when the watermark appears during video playbacks and the length of time it is visible." [ref=e291]
              - paragraph [ref=e292]:
                - text: In many cases, a resource contains references to other resources. For example, a
                - code [ref=e293]: playlistItem
                - text: resource's
                - code [ref=e294]: snippet.resourceId.videoId
                - text: property identifies a video resource that, in turn, contains complete information about the video. As another example, a search result contains either a
                - code [ref=e295]: videoId
                - text: ","
                - code [ref=e296]: playlistId
                - text: ", or"
                - code [ref=e297]: channelId
                - text: property that identifies a particular video, playlist, or channel resource.
              - heading "Supported operations" [level=3] [ref=e298]
              - paragraph [ref=e299]:
                - text: The following table shows the most common methods that the API supports. Some resources also support other methods that perform functions more specific to those resources. For example, the
                - code [ref=e300]: videos.rate
                - text: method associates a user rating with a video, and the
                - code [ref=e301]: thumbnails.set
                - text: method uploads a video thumbnail image to YouTube and associates it with a video.
              - table [ref=e302]:
                - rowgroup [ref=e303]:
                  - row [ref=e304]:
                    - columnheader "Operations" [ref=e305]
                  - row [ref=e306]:
                    - cell [ref=e307]:
                      - code [ref=e308]: list
                    - cell [ref=e309]:
                      - text: Retrieves (
                      - code [ref=e310]: GET
                      - text: ) a list of zero or more resources.
                  - row [ref=e311]:
                    - cell [ref=e312]:
                      - code [ref=e313]: insert
                    - cell [ref=e314]:
                      - text: Creates (
                      - code [ref=e315]: POST
                      - text: ) a new resource.
                  - row [ref=e316]:
                    - cell [ref=e317]:
                      - code [ref=e318]: update
                    - cell [ref=e319]:
                      - text: Modifies (
                      - code [ref=e320]: PUT
                      - text: ) an existing resource to reflect data in your request.
                  - row [ref=e321]:
                    - cell [ref=e322]:
                      - code [ref=e323]: delete
                    - cell [ref=e324]:
                      - text: Removes (
                      - code [ref=e325]: DELETE
                      - text: ) a specific resource.
              - paragraph [ref=e326]: The API supports methods to list each of the supported resource types, and it supports write operations for many resources as well.
              - paragraph [ref=e327]:
                - text: The following table identifies the operations that are supported for different types of resources. Operations that insert, update, or delete resources always require
                - link "user authorization" [ref=e328] [cursor=pointer]:
                  - /url: /youtube/data/guides/authentication
                - text: . In some cases,
                - code [ref=e329]: list
                - text: methods support both authorized and unauthorized requests, where unauthorized requests only retrieve public data while authorized requests can also retrieve information about or private to the authenticated user.
              - table [ref=e330]:

                    - cell "not_interested" [ref=e543]
                    - cell "not_interested" [ref=e545]
                    - cell "not_interested" [ref=e547]
                  - row [ref=e549]:
                    - cell [ref=e550]:
                      - code [ref=e551]:
                        - strong [ref=e552]: watermark
                    - cell "not_interested" [ref=e553]
                    - cell "not_interested" [ref=e555]
                    - cell "not_interested" [ref=e557]
                    - cell "not_interested" [ref=e559]
              - heading "Quota usage" [level=2] [ref=e561]
              - paragraph [ref=e562]:
                - text: The YouTube Data API uses a quota to ensure that developers use the service as intended and don't create applications that unfairly reduce service quality or limit access for others. All API requests, including invalid requests, incur at least a one-point quota cost. You can find the quota available to your application in the
                - link "API Console" [ref=e563] [cursor=pointer]:
                  - /url: https://console.cloud.google.com/
                - text: .
              - paragraph [ref=e564]:
                - text: Projects that enable the YouTube Data API have a default quota allocation of 100
                - code [ref=e565]: search.list
                - text: calls, 100
                - code [ref=e566]: videos.insert
                - text: calls, and 10,000 units per day combined for all other endpoints. Default quota, which is subject to change, helps us optimize quota allocations and scale our infrastructure in a way that is more meaningful to our API users. You can see your quota usage on the
                - link "Quotas" [ref=e567] [cursor=pointer]:
                  - /url: https://console.developers.google.com/iam-admin/quotas
                - text: page in the API Console.
              - paragraph [ref=e568]:
                - text: If you reach the quota limit, you can request additional quota by completing the
                - link "Quota extension request form" [ref=e569] [cursor=pointer]:
                  - /url: https://support.google.com/youtube/contact/yt_api_form
                - text: for YouTube API Services.
              - heading "Calculate quota usage" [level=3] [ref=e570]
              - paragraph [ref=e571]: "Google calculates your quota usage by assigning a cost to each request. Different types of operations have different quota costs. For example:"
              - list [ref=e572]:
                - listitem [ref=e573]: A read operation that retrieves a list of resources -- channels, videos, playlists -- usually costs 1 unit.
                - listitem [ref=e574]:
                  - text: A write operation that creates, updates, or deletes a resource usually costs
                  - code [ref=e575]: "50"
                  - text: units.
                - listitem [ref=e576]:
                  - text: A
                  - link "search query" [ref=e577] [cursor=pointer]:
                    - /url: /youtube/data/reference/rest/v3/search/list
                  - text: costs
                  - code [ref=e578]: "1"
                  - text: unit.
                - listitem [ref=e579]:
                  - text: A
                  - link "video upload" [ref=e580] [cursor=pointer]:
                    - /url: /youtube/data/reference/rest/v3/videos/insert
                  - text: costs
                  - code [ref=e581]: "1"
                  - text: unit.
              - paragraph [ref=e582]:
                - text: The
                - link "Quota costs for API requests" [ref=e583] [cursor=pointer]:
                  - /url: /youtube/data/determine_quota_cost
                - text: table shows the quota cost of each API method. With these rules in mind, you can estimate the number of requests that your application could send per day without exceeding your quota.
              - heading "Partial resources" [level=2] [ref=e584]
              - paragraph [ref=e585]: The API allows, and actually requires, the retrieval of partial resources so that applications avoid transferring, parsing, and storing unneeded data. This approach also ensures that the API uses network, CPU, and memory resources more efficiently.
              - paragraph [ref=e586]: The API supports two request parameters, which are explained in the following sections, that enable you to identify the resource properties that should be included in API responses.
              - list [ref=e587]:
                - listitem [ref=e588]:
                  - text: The
                  - link [ref=e589] [cursor=pointer]:
                    - /url: "#part"
                    - code [ref=e590]: part
                  - text: parameter identifies groups of properties that should be returned for a resource.
                - listitem [ref=e591]:
                  - text: The
                  - link [ref=e592] [cursor=pointer]:
                    - /url: "#fields"
                    - code [ref=e593]: fields
                  - text: parameter filters the API response to only return specific properties within the requested resource parts.
              - heading [level=3] [ref=e594]:
                - text: How to use the
                - code [ref=e595]: part
                - text: parameter
              - paragraph [ref=e596]:
                - text: The
                - code [ref=e597]: part
                - text: parameter is a required parameter for any API request that retrieves or returns a resource. The parameter identifies one or more top-level (non-nested) resource properties that should be included in an API response. For example, a
                - link [ref=e598] [cursor=pointer]:
                  - /url: /youtube/data/reference/rest/v3/videos#resource
                  - code [ref=e599]: video
                - text: "resource has the following parts:"
              - list [ref=e600]:
                - listitem [ref=e601]:
                  - code [ref=e602]: snippet
                - listitem [ref=e603]:
                  - code [ref=e604]: contentDetails
                - listitem [ref=e605]:
                  - code [ref=e606]: fileDetails
                - listitem [ref=e607]:
                  - code [ref=e608]: player
                - listitem [ref=e609]:
                  - code [ref=e610]: processingDetails
                - listitem [ref=e611]:
                  - code [ref=e612]: recordingDetails
                - listitem [ref=e613]:
                  - code [ref=e614]: statistics
                - listitem [ref=e615]:
                  - code [ref=e616]: status
                - listitem [ref=e617]:
                  - code [ref=e618]: suggestions
                - listitem [ref=e619]:
                  - code [ref=e620]: topicDetails
              - paragraph [ref=e621]:
                - text: All of these parts are objects that contain nested properties, and you can think of these objects as groups of metadata fields that the API server might (or might not) retrieve. As such, the
                - code [ref=e622]: part
                - text: "parameter requires you to select the resource components that your application actually uses. This requirement serves two key purposes:"
              - list [ref=e623]:
                - listitem [ref=e624]: It reduces latency by preventing the API server from spending time retrieving metadata fields that your application doesn't use.
                - listitem [ref=e625]: It reduces bandwidth usage by reducing (or eliminating) the amount of unnecessary data that your application might retrieve.
              - paragraph [ref=e626]: Over time, as resources add more parts, these benefits will only increase since your application won't be requesting newly introduced properties that it doesn't support.
              - heading [level=3] [ref=e627]:
                - text: How to use the
                - code [ref=e628]: fields
                - text: parameter
              - paragraph [ref=e629]:
                - text: The
                - code [ref=e630]: fields
                - text: parameter filters the API response, which only contains the resource parts identified in the
                - code [ref=e631]: part
                - text: parameter value, so that the response only includes a specific set of fields. The
                - code [ref=e632]: fields
                - text: parameter lets you remove nested properties from an API response and thereby further reduce your bandwidth usage. (The
                - code [ref=e633]: part
                - text: parameter cannot be used to filter nested properties from a response.)
              - paragraph [ref=e634]:
                - text: The following rules explain the supported syntax for the
                - code [ref=e635]: fields
                - text: "parameter value, which is loosely based on XPath syntax:"
              - list [ref=e636]:
                - listitem [ref=e637]:
                  - text: Use a comma-separated list (
                  - code [ref=e638]: fields=a,b
                  - text: ) to select multiple fields.
                - listitem [ref=e639]:
                  - text: Use an asterisk (
                  - code [ref=e640]: fields=*
                  - text: ) as a wildcard to identify all fields.
                - listitem [ref=e641]:
                  - text: Use parentheses (
                  - code [ref=e642]: fields=a(b,c)
                  - text: ) to specify a group of nested properties that will be included in the API response.
                - listitem [ref=e643]:
                  - text: Use a forward slash (
                  - code [ref=e644]: fields=a/b
                  - text: ) to identify a nested property.
              - paragraph [ref=e645]:
                - text: In practice, these rules often allow several different
                - code [ref=e646]: fields
                - text: "parameter values to retrieve the same API response. For example, if you want to retrieve the playlist item ID, title, and position for every item in a playlist, you could use any of the following values:"
              - list [ref=e647]:
                - listitem [ref=e648]:
                  - code [ref=e649]: fields=items/id,playlistItems/snippet/title,playlistItems/snippet/position
                - listitem [ref=e650]:
                  - code [ref=e651]: fields=items(id,snippet/title,snippet/position)
                - listitem [ref=e652]:
                  - code [ref=e653]: fields=items(id,snippet(title,position))
              - complementary [ref=e654]:
                - strong [ref=e655]: "Note:"
                - generic [ref=e656]:
                  - text: As with all query parameter values, the
                  - code [ref=e657]: fields
                  - text: parameter value must be URL encoded. For better readability, the examples in this document omit the encoding.
              - heading "Sample partial requests" [level=3] [ref=e658]
              - paragraph [ref=e659]:
                - text: The following examples demonstrate how you can use the
                - code [ref=e660]: part
                - text: and
                - code [ref=e661]: fields
                - text: "parameters to ensure that API responses only include the data that your application uses:"
              - list [ref=e662]:
                - listitem [ref=e663]:
                  - text: Example 1 returns a video resource that includes four parts as well as
                  - code [ref=e664]: kind
                  - text: and
                  - code [ref=e665]: etag
                  - text: properties.
                - listitem [ref=e666]:
                  - text: Example 2 returns a video resource that includes two parts as well as
                  - code [ref=e667]: kind
                  - text: and
                  - code [ref=e668]: etag
                  - text: properties.
                - listitem [ref=e669]:
                  - text: Example 3 returns a video resource that includes two parts but excludes
                  - code [ref=e670]: kind
                  - text: and
                  - code [ref=e671]: etag
                  - text: properties.
                - listitem [ref=e672]:
                  - text: Example 4 returns a video resource that includes two parts but excludes
                  - code [ref=e673]: kind
                  - text: and
                  - code [ref=e674]: etag
                  - text: as well as some nested properties in the resource's
                  - code [ref=e675]: snippet
                  - text: object.
              - heading "Optimize performance" [level=2] [ref=e676]
              - paragraph [ref=e677]:
                - text: You can use features like ETags and
                - code [ref=e678]: gzip
                - text: compression to improve your application's performance and reduce bandwidth usage.
              - heading "Use ETags" [level=3] [ref=e679]
              - paragraph [ref=e680]:
                - text: ETags, a standard part of the
                - link "HTTP protocol" [ref=e681] [cursor=pointer]:
                  - /url: https://www.rfc-editor.org/rfc/rfc9110.html#name-etag
                - text: ", allow applications to refer to a specific version of a particular API resource. The resource could be an entire feed or an item in that feed. This functionality supports the following use cases:"
              - list [ref=e682]:
                - listitem [ref=e683]:
                  - paragraph [ref=e684]:
                    - strong [ref=e685]: Caching and conditional retrieval
                    - text: – Your application can cache API resources and their ETags. Then, when your application requests a stored resource again, it specifies the ETag associated with that resource. If the resource has changed, the API returns the modified resource and the ETag associated with that version of the resource. If the resource has not changed, the API returns an HTTP 304 response (
                    - code [ref=e686]: Not Modified
                    - text: ), which indicates that the resource has not changed. Your application can reduce latency and bandwidth usage by serving cached resources in this manner.
                  - paragraph [ref=e687]:
                    - text: The client libraries for Google APIs differ in their support of ETags. For example, the JavaScript client library supports ETags using a whitelist for allowed request headers that includes
                    - code [ref=e688]: If-Match
                    - text: and
                    - code [ref=e689]: If-None-Match
                    - text: . The whitelist allows normal browser caching to occur so that if a resource's ETag has not changed, the resource can be served from the browser cache. The Obj-C client, on the other hand, does not support ETags.
                - listitem [ref=e690]:
                  - paragraph [ref=e691]:
                    - strong [ref=e692]: Protecting against inadvertent overwrites of changes
                    - text: – ETags help to ensure that multiple API clients don't inadvertently overwrite each other's changes. When updating or deleting a resource, your application can specify the resource's ETag. If the ETag doesn't match the most recent version of that resource, then the API request fails.
              - paragraph [ref=e693]: "Using ETags in your application provides several benefits:"
              - list [ref=e694]:
                - listitem [ref=e695]: The API responds more quickly to requests for cached but unchanged resources, yielding lower latency and lower bandwidth usage.
                - listitem [ref=e696]: Your application won't inadvertently overwrite changes to a resource that were made from another API client.
              - paragraph [ref=e697]:
                - text: The
                - link "Google APIs Client Library for JavaScript" [ref=e698] [cursor=pointer]:
                  - /url: /api-client-library/javascript/start/start-js
                - text: supports
                - code [ref=e699]: If-Match
                - text: and
                - code [ref=e700]: If-None-Match
                - text: HTTP request headers, thereby enabling ETags to work within the context of normal browser caching.
              - heading "Use gzip" [level=3] [ref=e701]
              - paragraph [ref=e702]: You can also reduce the bandwidth needed for each API response by enabling gzip compression. While your application will need additional CPU time to extract API responses, the benefit of consuming fewer network resources usually outweighs that cost.
              - paragraph [ref=e703]: "To receive a gzip-encoded response you must do two things:"
              - list [ref=e704]:
                - listitem [ref=e705]:
                  - text: Set the
                  - code [ref=e706]: Accept-Encoding
                  - text: HTTP request header to
                  - code [ref=e707]: gzip
                  - text: .
                - listitem [ref=e708]:
                  - text: Modify your user agent to contain the string
                  - code [ref=e709]: gzip
                  - text: .
              - paragraph [ref=e710]: "The following sample HTTP headers demonstrate these requirements for enabling gzip compression:"
              - code [ref=e713]: "Accept-Encoding: gzip User-Agent: my program (gzip)"
